
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | KU ResourceSavers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            width: 350px;
            max-width: calc(100% - 48px);
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #00000014;
        }
        h1 { color: #17365d; font-size: 25px; }
        label { display: block; margin-top: 16px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="login-box">
        <h1>KU ResourceSavers</h1>
        <p>Sign in to your campus account</p>

        {% if form.errors %}
            <p class="error" role="alert">
                Invalid username or password.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input type="text" name="username"
                   id="id_username" required autofocus>

            <label for="id_password">Password</label>
            <input type="password" name="password"
                   id="id_password" required>

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
