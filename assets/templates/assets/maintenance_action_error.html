
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maintenance Action Error | KU ResourceSavers</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #243247;
        }

        main {
            max-width: 650px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 3px 12px #0000000a;
        }

        h1 {
            color: #991b1b;
            font-size: 26px;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: #17365d;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <main>
        <section class="panel">
            <h1>Maintenance Action Could Not Be Completed</h1>

            <p>
                Maintenance #{{ maintenance.pk }}
                — {{ maintenance.title }}
            </p>

            {% for error in errors %}
                <div class="error" role="alert">
                    {{ error }}
                </div>
            {% endfor %}

            <a
                href="{% url 'maintenance_management' %}"
                class="btn"
            >
                Back to Maintenance
            </a>
        </section>
    </main>
</body>
</html>
